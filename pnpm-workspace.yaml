packages:
  - 'packages/*'
  # muya v2 (TS) nests its dev surface and Playwright suite inside its own
  # package directory rather than as siblings under packages/, so list them
  # explicitly.
  - 'packages/muya/examples'
  - 'packages/muya/e2e'

overrides:
  postcss: '8.5.15'
  'esbuild@>=0.27.0 <0.28.1': '0.28.1'

allowBuilds:
  # ced, keytar and native-keymap are built by `electron-rebuild -f` in
  # scripts/postinstall.ts, which replaces whatever an install-time build
  # produced. Building them at install time as well only adds a second
  # compiler run through pnpm's bundled node-gyp — an older release than the
  # one electron-rebuild uses, and one that fails outright on a machine whose
  # only Visual Studio is newer than it knows about.
  ced: false
  electron-winstaller: true
  esbuild: true
  keytar: false
  native-keymap: false
  sharp: true
  unrs-resolver: true
  workerd: true
